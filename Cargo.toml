[workspace]
resolver = "3"
members = [
    "crates/ak820-proto",
    "crates/ak820-device",
    "crates/ak820-store",
    "crates/ak820-cli",
    "apps/desktop",
]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/WhatTFF/linux-ajazz-ak820-pro-app"
rust-version = "1.85"

[workspace.dependencies]
ak820-proto = { path = "crates/ak820-proto" }
ak820-device = { path = "crates/ak820-device" }
ak820-store = { path = "crates/ak820-store" }

[profile.release]
lto = "thin"
strip = true
